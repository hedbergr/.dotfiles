# Enable mouse support (select panes/windows, resize, scroll)
set -g mouse on

# Start numbering windows and panes at 1, and renumber windows when one closes
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Use C-a as the prefix instead of C-b; press C-a twice to send a literal C-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Split panes with \ (horizontal) and - (vertical), keeping the current path
bind '\' split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'

# Clipboard: skicka markeringar till den lokala terminalen via OSC 52.
# Fungerar över SSH utan X11-forwarding - kräver att din lokala
# terminalemulator har OSC 52-write aktiverat.
set -g set-clipboard on
set -as terminal-features ',*:clipboard'

# Toggla musen. Räcker inte ensamt för native markering: appen i panen
# (t.ex. Claude Code) håller ofta egen mus-tracking, och då fortsätter tmux
# begära mushändelser oavsett. Håll Shift medan du markerar i stället - det
# åsidosätter appens musrapportering i VTE- och xterm-terminaler.
bind m set -g mouse \; display 'mouse #{?mouse,on,off}'
